name: CI

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - 'refactor/**'
  workflow_dispatch:
    inputs:
      run_live_data_rich_parity:
        description: "Run the opt-in live data-rich parity test"
        required: false
        default: false
        type: boolean
      run_live_isolation_parity:
        description: "Run the opt-in cross-user transaction isolation test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Push beruntun ke branch yang sama tidak menumpuk antrean runner --
# run lama yang keburu usang dibatalkan otomatis.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  PARITY_TEST_EMAIL: ${{ secrets.PARITY_TEST_EMAIL }}
  PARITY_TEST_PASSWORD: ${{ secrets.PARITY_TEST_PASSWORD }}
  PARITY_ISOLATION_EMAIL: ${{ secrets.PARITY_ISOLATION_EMAIL }}
  PARITY_ISOLATION_PASSWORD: ${{ secrets.PARITY_ISOLATION_PASSWORD }}
  LEGACY_TRANSACTION_ROWS_FILE: legacy-rows.json

jobs:
  # Suite unit terbukti 100% bebas import npm (hanya node:test + assert +
  # modul repo), jadi job ini TANPA npm install sama sekali: cepat (~30s)
  # dan kebal thd gangguan registry/download playwright. Termasuk gerbang
  # sintaks blok <script> index.html (tests/unit/index-inline-scripts.test.js).
  unit:
    name: Unit tests (tanpa install)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Run unit tests
        run: npm run test:unit

  # Gerbang kebocoran kredensial. Repo ini menyimpan SEMUA rahasia di GitHub
  # Actions secrets & Supabase dashboard; job ini yang menegakkan aturan itu
  # secara mekanis alih-alih mengandalkan kedisiplinan. Aturan pengecualian
  # (anon key Supabase yang publik by design, fixture AES di unit test) ada di
  # .gitleaks.toml -- dikunci ke pola isi, bukan ke nama file, supaya
  # service_role key yang salah tempel TETAP menggagalkan CI.
  #
  # Binary diunduh langsung & di-pin versinya, bukan lewat marketplace action:
  # gitleaks-action mensyaratkan lisensi untuk akun organisasi, dan versi
  # ter-pin membuat hasil scan reprodusibel.
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Ambil SELURUH riwayat -- `gitleaks git` di bawah memeriksa setiap
          # commit, bukan cuma kondisi kerja terakhir, jadi rahasia yang sempat
          # masuk lalu "dihapus" di commit berikutnya tetap ketahuan.
          fetch-depth: 0
      - name: Pasang gitleaks (versi ter-pin)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Pindai kondisi kerja saat ini
        run: /tmp/gitleaks dir . -c .gitleaks.toml --redact --no-banner
      - name: Pindai seluruh riwayat commit
        run: /tmp/gitleaks git . -c .gitleaks.toml --redact --no-banner

  # Gerbang statis: menangkap kelas bug yang TIDAK terlihat oleh suite unit --
  # variabel salah ketik, import mati setelah refactor, `case` tanpa `break`,
  # perbandingan longgar di kode finansial. Konfigurasinya (eslint.config.js)
  # sengaja hanya mengatur KEBENARAN, bukan gaya penulisan.
  lint:
    name: ESLint (gerbang statis)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        env:
          # ESLint tidak butuh browser -- jangan buang ~1 menit mengunduhnya.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Jalankan ESLint
        run: npm run lint

  css-drift:
    name: Tailwind build drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build & pastikan css/tailwind.css hasil commit tidak kadaluarsa
        run: |
          npm run build:css
          git diff --exit-code -- css/tailwind.css

  lighthouse:
    name: Lighthouse (pagar performa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium (untuk Lighthouse)
        run: npx playwright install --with-deps chromium
      - name: Jalankan Lighthouse & cek ambang
        run: node scripts/lighthouse/run.mjs

  # HANYA berjalan di push ke branch, TIDAK PERNAH di pull_request.
  #
  # Alasannya struktural, bukan preferensi: job ini menguji SITUS YANG SUDAH
  # TER-DEPLOY (lihat step "Tunggu deploy GitHub Pages" di bawah), sedangkan
  # GitHub Pages hanya men-deploy `main`. Untuk SHA milik branch PR, workflow
  # "pages build and deployment" tidak akan pernah ada, jadi step penunggu itu
  # PASTI habis waktu ~3 menit lalu exit 1 -- bukan karena ada yang rusak,
  # melainkan karena yang ditunggu memang tidak mungkin terjadi.
  #
  # Ini laten sejak lama (`on: pull_request` sudah ada di file ini) dan baru
  # terlihat 2026-09-01 ketika Dependabot mulai membuka PR: keempat PR-nya
  # merah di job ini padahal tidak ada satu pun yang salah dengan isinya.
  # Tambahan: PR dari Dependabot memang TIDAK diberi akses ke repository
  # secrets oleh GitHub, jadi SUPABASE_URL/ANON_KEY di job ini akan kosong --
  # alasan kedua kenapa uji live tidak mungkin bermakna di konteks PR.
  #
  # PR tetap terjaga oleh: unit, lint, secret-scan, css-drift, lighthouse.
  # Uji paritas live tetap jalan penuh saat perubahan mendarat di main.
  parity:
    name: Parity + headless (live Supabase)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install dependencies (reproducible dari lockfile)
        run: npm ci --no-audit --no-fund
        env:
          # Browser TIDAK ikut diunduh saat npm ci -- tetap lewat step
          # terpisah di bawah agar versi build browser terpin & eksplisit.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Tunggu deploy GitHub Pages selesai (hindari race browser vs deploy)
        # Deploy Pages berjalan PARALEL dgn CI ini; browser headless menguji SITE
        # LIVE, jadi kalau step ini lari saat deploy masih bertukar artifact, hasilnya
        # acak (kejadian nyata: 624aeec, 2026-08-30). Tunggu workflow "pages build and
        # deployment" utk commit INI selesai sukses dulu (maks ~3 menit), baru uji.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            STATUS=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=20" \
              | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and (.name | test("pages"; "i")))][0] | if . == null then "none" else (if .status != "completed" then .status else "completed:" + (.conclusion // "") end) end')
            echo "attempt $i: pages deploy = $STATUS"
            case "$STATUS" in
              completed:success) echo "Pages ter-deploy penuh utk $GITHUB_SHA"; exit 0 ;;
              completed:*) echo "Deploy Pages GAGAL ($STATUS) -- site live tidak akan memuat commit ini."; exit 1 ;;
            esac
            sleep 5
          done
          echo "Deploy Pages belum selesai dalam ~3 menit."; exit 1
      - name: Run fixture parity tests
        run: npm run test:parity
      - name: Observe production legacy transaction read
        run: npm run test:legacy-read
      - name: Validate legacy observation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.LEGACY_TRANSACTION_ROWS_FILE;
          if (!fs.existsSync(path)) throw new Error(`Missing ${path}`);
          const rows = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Array.isArray(rows)) throw new Error('Legacy observation is not an array');
          console.log(`Legacy observation: ${rows.length} rows`);
          NODE
      - name: Run final live transaction parity
        run: node tests/parity/compare-live-transactions.mjs
      - name: Remove parity data
        if: always()
        run: rm -f -- "$LEGACY_TRANSACTION_ROWS_FILE"

  live-data-rich:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_data_rich_parity == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install dependencies (reproducible dari lockfile)
        run: npm ci --no-audit --no-fund
      - name: Run opt-in live data-rich parity
        env:
          RUN_LIVE_DATA_RICH_PARITY: "true"
        run: node tests/parity/live-data-rich-parity.mjs

  live-isolation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_isolation_parity == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - name: Install dependencies (reproducible dari lockfile)
        run: npm ci --no-audit --no-fund
      - name: Run opt-in cross-user isolation parity
        env:
          RUN_LIVE_ISOLATION_PARITY: "true"
        run: node tests/parity/live-isolation-parity.mjs
