name: Parity Tests

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - 'refactor/**'

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  PARITY_TEST_EMAIL: ${{ secrets.PARITY_TEST_EMAIL }}
  PARITY_TEST_PASSWORD: ${{ secrets.PARITY_TEST_PASSWORD }}

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run fixture parity tests
        run: npm run test:parity

      - name: Run live transaction parity
        run: node tests/parity/transactions-live.test.js
