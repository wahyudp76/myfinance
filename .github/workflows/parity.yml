name: Parity Tests

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - 'refactor/**'
  workflow_dispatch:
    inputs:
      run_live_data_rich_parity:
        description: "Run the opt-in live data-rich parity test"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  PARITY_TEST_EMAIL: ${{ secrets.PARITY_TEST_EMAIL }}
  PARITY_TEST_PASSWORD: ${{ secrets.PARITY_TEST_PASSWORD }}
  LEGACY_TRANSACTION_ROWS_FILE: legacy-rows.json

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run fixture parity tests
        run: npm run test:parity

      - name: Observe production legacy transaction read
        run: npm run test:legacy-read

      - name: Validate legacy observation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = process.env.LEGACY_TRANSACTION_ROWS_FILE;
          if (!fs.existsSync(path)) throw new Error(`Missing ${path}`);
          const rows = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!Array.isArray(rows)) throw new Error('Legacy observation is not an array');
          console.log(`Legacy observation: ${rows.length} rows`);
          NODE

      - name: Run final live transaction parity
        run: node tests/parity/compare-live-transactions.mjs

      - name: Remove parity data
        if: always()
        run: rm -f -- "$LEGACY_TRANSACTION_ROWS_FILE"

  live-data-rich:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_data_rich_parity == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run opt-in live data-rich parity
        env:
          RUN_LIVE_DATA_RICH_PARITY: "true"
        run: node tests/parity/live-data-rich-parity.mjs
