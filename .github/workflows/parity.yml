name: Parity Tests

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - 'refactor/**'

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  PARITY_TEST_EMAIL: ${{ secrets.PARITY_TEST_EMAIL }}
  PARITY_TEST_PASSWORD: ${{ secrets.PARITY_TEST_PASSWORD }}

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run fixture parity tests
        run: npm run test:parity

      - name: Observe production legacy transaction read
        run: npm run test:legacy-read > legacy-rows.json

      - name: Validate legacy observation
        run: node -e 'const fs=require("fs"); const rows=JSON.parse(fs.readFileSync("legacy-rows.json","utf8")); if(!Array.isArray(rows)) throw new Error("Legacy observation is not an array"); console.log(`Legacy observation: ${rows.length} rows`);'

      - name: Run final live transaction parity
        env:
          LEGACY_TRANSACTION_ROWS_FILE: legacy-rows.json
        run: node tests/parity/compare-live-transactions.mjs

      - name: Remove parity data
        if: always()
        run: rm -f legacy-rows.json
