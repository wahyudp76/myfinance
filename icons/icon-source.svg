<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background, edge to edge. No border or padding: this rounded square IS the whole canvas. -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Card + coin glyph, scaled slightly in from center for comfortable margin
       under Android's maskable-icon safe zone (adaptive icons can crop to a circle). -->
  <g transform="translate(256,256) scale(0.9) translate(-256,-256)">
    <rect x="112" y="168" width="288" height="196" rx="30" fill="#ffffff"/>
    <rect x="146" y="228" width="56" height="40" rx="8" fill="#c7d2fe"/>
    <rect x="146" y="292" width="140" height="14" rx="7" fill="#e0e7ff"/>
    <circle cx="366" cy="330" r="42" fill="url(#coin)"/>
    <circle cx="366" cy="330" r="42" fill="none" stroke="#ffffff" stroke-width="8"/>
  </g>
</svg>
